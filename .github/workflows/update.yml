name: update

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (GitHub may run it late or skip one)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # Descriptions are cached between runs here, not in the repo.
      - name: Restore description cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: desc-cache-${{ github.run_id }}
          restore-keys: desc-cache-
      - name: Sync company registry from secnet-internships
        run: python tools/sync_companies.py
      - name: Scan
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          WORKDAY_PROXY: ${{ secrets.WORKDAY_PROXY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run.py
      - name: Commit
        run: |
          git config user.name "secnet-parttime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md data docs
          git diff --cached --quiet || git commit -m "chore: update part-time roles ($(date -u +%F))"
          git push
