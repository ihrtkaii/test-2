<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>secnet part-time</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #14171c; --muted: #5d6673; --line: #e2e5ea;
    --accent: #0b6e4f; --chip: #eef1f4; --warn: #9a5b00; --warn-bg: #fff4e0;
    --ok: #0b6e4f; --ok-bg: #e3f4ec; --maybe: #7a5a00; --maybe-bg: #fbf1d6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1116; --panel: #161a21; --ink: #e8ebf0; --muted: #98a1ad; --line: #262c36;
            --accent: #3fc495; --chip: #1f252e; --warn: #f2b45a; --warn-bg: #2d2412;
            --ok: #6fd8ad; --ok-bg: #12291f; --maybe: #e8c36a; --maybe-bg: #2a2412; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 28px 16px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .tabs { display: flex; gap: 4px; max-width: 1100px; margin: 12px auto 0; padding: 0 16px; }
  .tabs button { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600;
         padding: 8px 12px; border-bottom: 2px solid transparent; cursor: pointer; }
  .tabs button[aria-selected=true] { color: var(--ink); border-color: var(--accent); }
  .bar { position: sticky; top: 0; z-index: 2; background: var(--bg);
         padding: 12px 16px; max-width: 1100px; margin: 0 auto;
         display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input[type=search] { flex: 1 1 220px; padding: 9px 12px; border: 1px solid var(--line);
         border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
         padding: 6px 10px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 1100px; margin: 0 auto; padding: 4px 16px 48px; }
  .count { color: var(--muted); font-size: 13px; margin: 4px 0 10px; }
  .note { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 12px 14px; margin-bottom: 8px; display: grid;
          grid-template-columns: 1fr auto; gap: 4px 12px; }
  .title { font-weight: 600; overflow-wrap: anywhere; }
  .title a { color: inherit; text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .co { color: var(--muted); overflow-wrap: anywhere; }
  .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; }
  .chip { background: var(--chip); padding: 2px 8px; border-radius: 6px; }
  .fit-confirmed { background: var(--ok-bg); color: var(--ok); }
  .fit-possible { background: var(--maybe-bg); color: var(--maybe); }
  .flag { background: var(--warn-bg); color: var(--warn); padding: 2px 8px; border-radius: 6px; }
  .date { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  details { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
  summary { cursor: pointer; }
  dl { margin: 6px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; }
  dt { font-weight: 600; text-transform: capitalize; }
  dd { margin: 0; overflow-wrap: anywhere; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Part-time security roles</h1>
  <div class="sub">Remote or Orlando area · 20 hrs/week or less · <span id="updated">loading…</span></div>
</header>
<div class="tabs" role="tablist">
  <button role="tab" data-q="listed" aria-selected="true">Main list <span id="n-listed"></span></button>
  <button role="tab" data-q="review" aria-selected="false">Worth checking <span id="n-review"></span></button>
</div>
<div class="bar">
  <input type="search" id="q" placeholder="Search company, role, flag…" aria-label="Search">
  <div class="seg" id="kinds"></div>
  <div class="seg" id="wheres"></div>
</div>
<main>
  <p class="note" id="note"></p>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>
<script>
const KINDS = ["All", "Part-Time Internships", "Part-Time Jobs", "Federal / Pathways", "Contract / Freelance"];
const WHERES = ["Anywhere", "Remote", "Orlando"];
const NOTES = {
  listed: "Confirmed: stated hours are all 20 a week or less. Possible: part-time with no hours stated, or a range that goes past 20.",
  review: "Plausible but unproven: seasonal or flexible wording with no hours, or a broad title at a priority employer with no description. Open the posting to decide."
};
const state = { queue: "listed", kind: "All", where: "Anywhere", q: "" };
let jobs = [];

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function buttons(id, values, key) {
  const el = document.getElementById(id);
  el.innerHTML = values.map(v => `<button type="button" data-v="${esc(v)}">${esc(v)}</button>`).join("");
  el.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state[key] = b.dataset.v; render();
  });
}

function card(j) {
  const fit = j.schedule_fit === "confirmed" ? "Confirmed fit" : j.schedule_fit === "possible" ? "Possible fit" : "Schedule unknown";
  // A plain "location: X" entry repeats the Location row below; only show
  // location evidence when it is a sentence from the posting.
  const ev = Object.entries(j.evidence || {}).filter(([k, v]) => !(k === "location" && v.startsWith("location: ")));
  const alts = (j.alternate_sources || []).map(a => `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)}</a>`).join(", ");
  return `<div class="card">
    <div><div class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
      <div class="co">${esc(j.company)}${j.priority ? " · priority employer" : ""}</div></div>
    <div class="date">${esc((j.posted_at || j.first_seen || "").slice(0, 10))}</div>
    <div class="meta">
      <span class="chip fit-${esc(j.schedule_fit)}">${fit}</span>
      <span class="chip">${esc(j.kind)}</span><span class="chip">${esc(j.where)}</span>
      <span class="chip">${esc(j.category)}</span>
      ${j.hours ? `<span class="chip">${esc(j.hours)}</span>` : ""}
      ${j.salary ? `<span class="chip">${esc(j.salary)}</span>` : ""}
      ${(j.display_flags || []).map(f => `<span class="flag">${esc(f)}</span>`).join("")}
    </div>
    ${ev.length || alts ? `<details><summary>Why it's here</summary><dl>
      ${ev.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}
      <dt>Location</dt><dd>${esc(j.location)}</dd>
      ${alts ? `<dt>Also on</dt><dd>${alts}</dd>` : ""}
    </dl></details>` : ""}
  </div>`;
}

function render() {
  for (const [id, key] of [["kinds", "kind"], ["wheres", "where"]])
    document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state[key]));
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.q === state.queue));
  document.getElementById("note").textContent = NOTES[state.queue];
  const q = state.q.toLowerCase();
  const pool = jobs.filter(j => j.queue === state.queue);
  const rows = pool.filter(j =>
    (state.kind === "All" || j.kind === state.kind) &&
    (state.where === "Anywhere" || (j.where || "").includes(state.where)) &&
    (!q || [j.company, j.title, j.location, j.category, ...(j.display_flags || [])].join(" ").toLowerCase().includes(q)));
  document.getElementById("count").textContent = `${rows.length} of ${pool.length}`;
  document.getElementById("list").innerHTML = rows.length ? rows.map(card).join("")
    : `<div class="empty">Nothing matches. Try clearing a filter.</div>`;
}

buttons("kinds", KINDS, "kind");
buttons("wheres", WHERES, "where");
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; state.queue = b.dataset.q; render();
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
fetch("jobs.json", { cache: "no-store" }).then(r => r.json()).then(d => {
  jobs = d.jobs || [];
  document.getElementById("n-listed").textContent = `(${jobs.filter(j => j.queue === "listed").length})`;
  document.getElementById("n-review").textContent = `(${jobs.filter(j => j.queue === "review").length})`;
  document.getElementById("updated").textContent = "updated " + (d.updated || "").slice(0, 16).replace("T", " ") + " UTC";
  render();
}).catch(() => { document.getElementById("updated").textContent = "no data yet"; render(); });
</script>
</body>
</html>
